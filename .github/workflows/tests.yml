name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python test_remove_ads.py
      - run: python test_cross_platform.py
      - run: python test_features.py
      - run: python remove_ads.py --help
      - run: python remove_ads.py --version
      - run: python remove_ads.py --list-sdks
      # informational only: exit 3 just means Java/tools are absent on the runner
      - run: python remove_ads.py --check-deps || true

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python test_workflow.py
